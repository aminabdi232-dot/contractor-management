<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به سامانه شرکت</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% -20%,#203653 0,transparent 55%),#0b1220;color:#f3f6fb;font-family:Tahoma,sans-serif}
main{width:min(100%,420px);padding:28px;background:#151f31;border:1px solid #293a52;border-radius:18px;box-shadow:0 20px 60px #0005}
h1{font-size:23px;margin:0 0 10px}.sub{color:#a9b6c9;font-size:13px;line-height:2;margin:0 0 24px}
label{display:block;color:#a9b6c9;font-size:13px;margin:15px 0}input{display:block;width:100%;margin-top:8px;padding:13px;background:#0b1422;border:1px solid #33445b;border-radius:9px;color:#fff;font:14px Tahoma}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#0f766e;color:white;font:14px Tahoma;cursor:pointer;margin-top:12px}button:disabled{opacity:.6}#login-status{font-size:12px;line-height:2;min-height:24px;margin-top:14px}
</style></head><body><main><h1>ورود به سامانه شرکت</h1><p class="sub">برای ورود، شماره همراه ثبت‌شده و رمز عبور حساب کاربری خود را وارد کنید.</p>
<form id="login-form"><label>شماره همراه<input id="phone" type="tel" autocomplete="username" placeholder="09xxxxxxxxx" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">ورود به سامانه</button></form><div id="login-status" role="status"></div></main><script type="module" src="app.js"></script></body></html>
