<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>خوش آمدید | سامانه امین عبدی</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0,#25415f,transparent 55%),#0b1220;color:#f4f7fb;font-family:Tahoma,sans-serif}.welcome{width:min(760px,100%);text-align:center;padding:56px 28px;border:1px solid #293a52;border-radius:28px;background:linear-gradient(145deg,#19283d,#111c2c);box-shadow:0 28px 90px #0006}.mark{width:88px;height:88px;margin:0 auto 28px;border-radius:25px;display:grid;place-items:center;background:#164e52;color:#5eead4;font-size:38px;border:1px solid #367f7c}h1{font-size:clamp(27px,5vw,43px);margin:0 0 16px;line-height:1.7}.sub{color:#a9b6c9;font-size:15px;line-height:2.2;margin:0 auto 34px;max-width:540px}.enter{display:inline-flex;text-decoration:none;background:#0f766e;color:white;padding:15px 32px;border-radius:12px;font-size:14px;box-shadow:0 8px 25px #0f766e44;transition:.2s}.enter:hover{transform:translateY(-3px);background:#0d9488}.foot{margin-top:42px;color:#718198;font-size:11px}</style></head><body><main class="welcome"><div class="mark">✦</div><h1>به سامانه امین عبدی خوش آمدید</h1><p class="sub">سامانه یکپارچه مدیریت و پشتیبانی امور شرکت<br>برای ورود به فضای کاری، از دکمه زیر استفاده کنید.</p><a class="enter" href="panel.html">ورود به سامانه <span style="margin-right:12px">←</span></a><div class="foot">سامانه اختصاصی امین عبدی</div></main><script type="module" src="app.js"></script></body></html>
