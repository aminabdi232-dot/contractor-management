<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>زیرمجموعه سامانه</title></head><body><main><a href="panel.html">بازگشت به پنل اولیه</a><h1 id="sub-title">زیرمجموعه</h1><p id="sub-desc"></p><section class="panel"><h2>ثبت اطلاعات و پیگیری</h2><div class="fields"><label>عنوان<input id="record-title" placeholder="عنوان موردنظر"></label><label>پروژه مرتبط<input id="record-project" placeholder="نام پروژه"></label><label>شماره / کد<input id="record-ref" placeholder="شماره سند یا کد"></label><label>مبلغ (ریال)<input id="record-amount" inputmode="numeric" placeholder="در صورت نیاز"></label><label>وضعیت<select id="record-status"><option value="پیش‌نویس">پیش‌نویس</option><option value="در حال انجام">در حال انجام</option><option value="در انتظار تأیید">در انتظار تأیید</option><option value="تکمیل‌شده">تکمیل‌شده</option></select></label><label>مسئول پیگیری<input id="record-owner" placeholder="نام مسئول"></label></div><label>توضیحات<textarea id="record-details" placeholder="شرح اطلاعات، اقدامات و پیگیری‌ها"></textarea></label><button id="record-save" type="button">ذخیره اطلاعات</button><p id="record-message"></p><h2>سوابق ثبت‌شده</h2><div id="record-list"></div></section></main><style>
*{box-sizing:border-box}body{margin:0;padding:28px 18px;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#203653,transparent 55%),#0b1220;color:#f3f6fb;font-family:Tahoma,sans-serif}main{max-width:1050px;margin:auto}a{display:inline-block;color:#5eead4;text-decoration:none;border:1px solid #367f7c;border-radius:10px;padding:10px 14px;margin-bottom:24px}h1{font-size:30px}.panel{margin-top:22px;padding:22px;background:#151f31;border:1px solid #293a52;border-radius:18px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}label{display:block;color:#a9b6c9;font-size:12px;margin:12px 0}input,select,textarea{display:block;width:100%;margin-top:7px;padding:12px;background:#0b1422;color:#f3f6fb;border:1px solid #33445b;border-radius:9px;font:13px Tahoma}textarea{min-height:100px}button{margin:14px 0;padding:12px 20px;border:0;border-radius:9px;background:#0f766e;color:white;font:13px Tahoma;cursor:pointer}#record-list article{padding:13px;margin:9px 0;border:1px solid #293a52;border-radius:10px;background:#0b1422;color:#a9b6c9;line-height:2}@media(max-width:650px){.fields{grid-template-columns:1fr}}</style><script type="module" src="app.js"></script></body></html>
