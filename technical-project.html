<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرونده فنی پروژه</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px 18px;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#203653,transparent 55%),#0b1220;color:#f3f6fb;font-family:Tahoma,"Segoe UI",sans-serif}main{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:25px}h1{font-size:clamp(22px,4vw,32px);margin:0 0 9px}.sub{color:#a9b6c9;font-size:13px;line-height:2;margin:0}.back{color:#e0c58e;text-decoration:none;border:1px solid #806c48;padding:10px 14px;border-radius:10px;font-size:12px}.scope{display:inline-block;margin-top:12px;padding:6px 11px;border-radius:20px;border:1px solid #806c48;color:#e0c58e;font-size:12px}.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.doc{display:flex;align-items:center;gap:14px;min-height:116px;padding:18px;text-decoration:none;color:#f3f6fb;background:linear-gradient(145deg,#19283d,#121d2e);border:1px solid #293a52;border-radius:16px;transition:.18s}.doc:hover{border-color:#b99b62;transform:translateY(-3px)}.glyph{width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center;border-radius:14px;background:#c7a96b1a;border:1px solid #806c48;color:#e0c58e;font-size:25px}.doc b{display:block;font-size:14px;margin-bottom:7px}.doc small{font-size:11px;color:#9eafc4;line-height:1.8}footer{text-align:center;color:#718198;font-size:11px;margin:28px}@media(max-width:720px){.docs{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.docs{grid-template-columns:1fr}}
</style></head><body><main><header class="top"><div><h1 id="project-title">پرونده فنی پروژه</h1><p class="sub">برای ورود به هر پرونده، روی عنوان مربوط کلیک کنید.</p><span id="scope" class="scope" hidden></span></div><a class="back" href="technical.html">← بازگشت به پروژه‌ها</a></header><section class="docs" id="docs"></section><footer>سامانه مدیریت فنی و مهندسی</footer></main><script>
const q=new URLSearchParams(location.search),project=q.get("project")||"",scope=q.get("scope")||"";
document.getElementById("project-title").textContent=project||"پرونده فنی پروژه";
if(scope){const s=document.getElementById("scope");s.hidden=false;s.textContent=scope;}
document.title=(project||"پرونده فنی")+" | سامانه امین عبدی";
const items=[["▤","قرارداد","اطلاعات قرارداد، مبلغ، مدت و الحاقیه‌ها"],["▧","صورت وضعیت","صورت‌وضعیت‌های موقت و قطعی"],["▥","تعدیل","شاخص‌ها و محاسبات تعدیل"],["▦","صورت جلسات","صورت‌جلسات کارگاهی و توافق‌ها"],["⌂","تحویل موقت","مدارک و مراحل تحویل موقت"]];
const root=document.getElementById("docs");
items.forEach(([icon,title,desc])=>{const a=document.createElement("a");a.className="doc";const params=new URLSearchParams({module:"technical",title,project});if(scope)params.set("scope",scope);a.href="submodule.html?"+params.toString();const g=document.createElement("span");g.className="glyph";g.textContent=icon;const t=document.createElement("span");const b=document.createElement("b");b.textContent=title;const d=document.createElement("small");d.textContent=desc;t.append(b,d);a.append(g,t);root.append(a);});
</script></body></html>
