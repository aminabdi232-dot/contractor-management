<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خیلی دیر کردی امین طاهونه‌چی!</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#245b49 0,transparent 42%),linear-gradient(145deg,#071b17,#102c25 60%,#101827);font-family:Tahoma,Arial,sans-serif;color:#f4f8f5}
.card{width:min(650px,100%);padding:clamp(32px,7vw,64px);border:1px solid #477b65;border-radius:28px;background:#0c211dcc;box-shadow:0 25px 80px #0008;text-align:center}
.tag{display:inline-block;margin-bottom:24px;padding:8px 15px;border:1px solid #477b65;border-radius:30px;color:#b8e6ce;font-size:13px}
h1{font-size:clamp(27px,5vw,42px);line-height:1.9;margin:0 0 28px}
a{display:inline-block;text-decoration:none;background:#b8d9c8;color:#10271e;padding:14px 34px;border-radius:12px;font-weight:bold;transition:.2s}a:hover{transform:translateY(-2px);background:#d1eddf}
</style>
</head>
<body>
<main class="card">
<div class="tag">پیام خوش‌آمدگویی</div>
<h1>خیلی دیر کردی امین طاهونه‌چی!</h1>
<a href="intro.html">بعدی</a>
</main>
</body>
</html>
