<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعیین رمز جدید</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% -20%,#203653 0,transparent 55%),#0b1220;color:#f3f6fb;font-family:Tahoma,sans-serif}main{width:min(100%,420px);padding:28px;background:#151f31;border:1px solid #293a52;border-radius:18px}h1{font-size:22px}.sub{color:#a9b6c9;font-size:13px;line-height:2}label{display:block;color:#a9b6c9;font-size:13px;margin:16px 0}input{display:block;width:100%;margin-top:8px;padding:13px;background:#0b1422;border:1px solid #33445b;border-radius:9px;color:#fff;font:14px Tahoma}button{width:100%;padding:13px;border:0;border-radius:9px;background:#0f766e;color:white;font:14px Tahoma;cursor:pointer;margin-top:12px}#reset-status{font-size:12px;line-height:2;min-height:24px;margin-top:14px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></head><body><main><h1>تعیین رمز عبور جدید</h1><p class="sub">رمز جدید را وارد و برای تأیید، یک بار دیگر تکرار کنید.</p><form id="reset-form"><label>رمز جدید<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label><label>تکرار رمز جدید<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">ثبت رمز جدید</button></form><div id="reset-status" role="status"></div></main><script type="module" src="app.js"></script></body></html>
